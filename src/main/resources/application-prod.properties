spring.application.name=salesapp

# ============================================
# PRODUCTION CONFIGURATION
# All sensitive values come from environment variables
# ============================================

# MySQL Database Configuration (from environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/aaprintntags?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate Configuration
# 'none' skips schema scan on startup — eliminates 2-3 min DDL diff overhead.
# Use migration.sql / manual ALTER statements for schema changes.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Lazy bean initialisation — beans load on first HTTP request, not at startup
spring.main.lazy-initialization=true

# Connection Pool (tuned for small VMs)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.pool-name=AAPrintPool

# JWT Configuration (from environment)
app.jwt.secret=${APP_JWT_SECRET:4a6f686e446f6553616c65734170704a57545365637265744b65793230323621}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Logging (production - minimal)
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.salesapp=INFO
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%level] [%logger{36}] - %msg%n

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Server
server.port=8080

