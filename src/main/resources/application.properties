spring.application.name=salesapp

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/aaprintntags?useSSL=true&requireSSL=true
spring.datasource.username=root
#spring.datasource.password=root

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# SQL formatting
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=4a6f686e446f6553616c65734170704a57545365637265744b65793230323621
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%thread] [%level] [requestId=%X{requestId}] [%logger{36}] - %msg%n
# Write logs to a file (for the browser log viewer) with rotation
logging.file.name=logs/salesapp.log
logging.pattern.file=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%thread] [%level] [requestId=%X{requestId}] [%logger{36}] - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=100MB

# File Upload (for tenant logos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
