name: CI/CD - Build & Deploy to Oracle Cloud

# ───────────────────────────────────────────────────────────────
#  Triggers on every push to main. Builds a Docker image, pushes
#  it to GitHub Container Registry (GHCR), then deploys ONLY the
#  application container to the Oracle Cloud VM. The MySQL database
#  container is never touched, so data is always preserved.
# ───────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual "Run workflow" button

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt an in-flight deploy

env:
  REGISTRY: ghcr.io

jobs:
  # ===============================================================
  #  1) BUILD the image (JAR + frontend) and push to GHCR
  # ===============================================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===============================================================
  #  2) DEPLOY the new image to the Oracle Cloud VM (DB untouched)
  # ===============================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (for the server-deploy script)
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.ORACLE_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deploy script to VM
        run: |
          scp -i ~/.ssh/id_deploy deploy/server-deploy.sh \
            "${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:/home/${{ secrets.ORACLE_SSH_USER }}/server-deploy.sh"

      - name: Deploy on VM
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}" \
            "chmod +x ~/server-deploy.sh && \
             GHCR_USER='${{ github.actor }}' \
             GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             APP_IMAGE='${IMAGE}' \
             DB_NAME='${{ secrets.DB_NAME }}' \
             DB_USER='${{ secrets.DB_USER }}' \
             DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
             DB_ROOT_PASSWORD='${{ secrets.DB_ROOT_PASSWORD }}' \
             JWT_SECRET='${{ secrets.JWT_SECRET }}' \
             LOGS_USER='${{ secrets.LOGS_USER }}' \
             LOGS_PASSWORD='${{ secrets.LOGS_PASSWORD }}' \
             ~/server-deploy.sh"

