# ============================================================
#  AA Print N Tags — Nginx HTTPS template
#  Activated at runtime by deploy/start.sh ONLY when a TLS cert
#  exists for $CERT_DOMAIN. __DOMAIN__ is substituted with the
#  actual hostname (e.g. 140-245-210-80.sslip.io).
# ============================================================

# ---- Port 80: ACME challenge + health + redirect to HTTPS ----
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (cert renewals via webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Keep the container HEALTHCHECK working over plain HTTP
    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Port 443: the application over TLS ----
server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:AAPNT_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Container log viewer (Dozzle) — protected by basic auth ──
    # ^~ ensures this prefix wins over the regex asset-cache location below,
    # so Dozzle's own /logs/assets/*.js|css are proxied (not served locally).
    location ^~ /logs/ {
        auth_basic "SalesApp Logs";
        auth_basic_user_file /etc/nginx/.htpasswd;
        resolver __RESOLVER__ valid=30s;
        set $dozzle_upstream "aaprintntags-logs:8080";
        proxy_pass http://$dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
        client_max_body_size 10M;
    }

    location /logos/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

