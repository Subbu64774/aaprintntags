# ============================================================
#  AA Print N Tags — Nginx (HTTP)
#  Serves the React frontend and reverse-proxies /api + /logos
#  to Spring Boot. TLS/HTTPS is added separately as a hardening
#  step (see deploy/setup-https.sh + docs/CICD_SETUP.md).
# ============================================================

# WebSocket/SSE upgrade handling (empty Connection for SSE → streaming works)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;


    # ── Container log viewer (Dozzle) — protected by basic auth ──
    # ^~ so Dozzle's /logs/assets/*.js|css proxy correctly (beat regex below)
    location ^~ /logs/ {
        auth_basic "SalesApp Logs";
        auth_basic_user_file /etc/nginx/.htpasswd;
        resolver __RESOLVER__ valid=30s;
        set $dozzle_upstream "aaprintntags-logs:8080";
        proxy_pass http://$dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ── Proxy-friendly app log viewer (plain HTTP polling) ──
    location = /applogs { return 302 /applogs/; }
    location = /applogs/ {
        auth_basic "SalesApp Logs";
        auth_basic_user_file /etc/nginx/.htpasswd;
        alias /usr/share/nginx/applogs.html;
        default_type text/html;
    }
    location = /applogs/raw {
        auth_basic "SalesApp Logs";
        auth_basic_user_file /etc/nginx/.htpasswd;
        alias /app/logs/salesapp.log;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # Frontend - serve static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API requests → proxy to Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
        client_max_body_size 10M;
    }

    # Logo uploads → proxy to Spring Boot
    location /logos/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend SPA - all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

