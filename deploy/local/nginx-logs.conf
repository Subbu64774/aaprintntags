events {}

http {
    # SSE/WebSocket-safe Connection header (empty for SSE → streaming works)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80;
        server_name _;

        # Mirrors the production /logs/ proxy so we can validate the SSE fix locally
        location ^~ /logs/ {
            auth_basic "SalesApp Logs";
            auth_basic_user_file /etc/nginx/.htpasswd;
            resolver 127.0.0.11 valid=30s;
            set $dozzle_upstream "dozzle:8080";
            proxy_pass http://$dozzle_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        location / { return 302 /logs/; }
    }
}

