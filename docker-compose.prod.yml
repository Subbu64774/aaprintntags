# ============================================
# Docker Compose - Production Setup
# Run: docker compose -f docker-compose.prod.yml up -d
# ============================================
version: '3.8'

services:
  # ---- MySQL Database ----
  db:
    image: mysql:8.0
    container_name: aaprintntags-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-StrongP@ss2026!}
      MYSQL_DATABASE: aaprintntags
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-AppUser@2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=100
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-StrongP@ss2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Application (Backend + Frontend) ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aaprintntags-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/aaprintntags?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-AppUser@2026!}
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # JWT - CHANGE THIS IN PRODUCTION!
      APP_JWT_SECRET: ${JWT_SECRET:-4a6f686e446f6553616c65734170704a57545365637265744b65793230323621}
      APP_JWT_EXPIRATION_MS: 86400000
      # Java memory
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_logos:/app/logos

volumes:
  mysql_data:
    driver: local
  app_logos:
    driver: local

